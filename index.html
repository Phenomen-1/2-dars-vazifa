<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natijalar oynasi</title>
  <!-- CSS faylni ulash -->
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="card-container">
    
    <!-- Chap blok (Ko'k qism) -->
    <div class="result-box">
      <div class="result-title">Your Result</div>
      
      <div class="score-circle">
        <div class="score-number">76</div>
        <div class="score-total">of 100</div>
      </div>
      
      <div class="status">Great</div>
      <p class="description">
        Your performance exceed 65% of the people conducting the test here!
      </p>
    </div>

    <!-- O'ng blok (Summary qismi) -->
    <div class="summary-box">
      <div class="summary-title">Summary</div>

      <div class="item-list">
        <!-- Reaction -->
        <div class="item reaction">
          <div class="item-label">⚡️ Reaction</div>
          <div class="item-score">80 <span>/ 100</span></div>
        </div>

        <!-- Memory -->
        <div class="item memory">
          <div class="item-label">🧠 Memory</div>
          <div class="item-score">92 <span>/ 100</span></div>
        </div>

        <!-- Verbal -->
        <div class="item verbal">
          <div class="item-label">💬 Verbal</div>
          <div class="item-score">61 <span>/ 100</span></div>
        </div>

        <!-- Visual -->
        <div class="item visual">
          <div class="item-label">👁️ Visual</div>
          <div class="item-score">73 <span>/ 100</span></div>
        </div>
      </div>

      <button class="btn-continue">Continue</button>
    </div>

  </div>

</body>
</html>
